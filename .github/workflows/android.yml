name: Android build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.github/workflows/cleanup.yml'
      - '.github/dependabot.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Check mobile web behavior
        run: node --test scripts/test-web.mjs
      - name: Generate official Gradle wrapper
        run: gradle --no-daemon wrapper --gradle-version 8.11.1 --distribution-type bin
      - name: Check and build both variants
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug assembleRelease
      - name: Collect installable APK
        id: metadata
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/TVInbox-v${VERSION}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk > "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"
          if grep -Eiq '(测试版|preview|versionName=.*-debug)' "$RUNNER_TEMP/badging.txt"; then
            echo 'Unexpected distribution label in APK metadata'; exit 1
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS)
          printf 'Commit: %s\nVersion: %s\nPackage: io.github.zhshuaii.tvinbox.debug\nSigning: CI-generated key\nBuild: %s\n' "$GITHUB_SHA" "$VERSION" "$GITHUB_RUN_NUMBER" > dist/build-info.txt
          echo "## TVInbox $VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo 'Signing uses a CI-generated key, not a persistent owner-managed key.' >> "$GITHUB_STEP_SUMMARY"
          stat --printf='APK: %s bytes\n' dist/*.apk >> "$GITHUB_STEP_SUMMARY"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions dist/*.apk >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: TVInbox
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-and-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TVInbox
          path: dist
      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          MAIN_SHA="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$MAIN_SHA" != "$GITHUB_SHA" ]]; then
            echo '::error::main advanced after this build. Run the workflow from the current main before publishing.'
            exit 1
          fi
          TAG="v${VERSION}"
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## 轻收 · TVInbox ${VERSION}
          手机扫码上传 APK，电视列表手动安装、删除和清空。上传不会自动安装。

          下载附件 TVInbox-v${VERSION}.apk；Source code 附件不是安装包。
          配套 SHA256SUMS 可校验文件，build-info.txt 记录源码提交。

          版本号：${VERSION}。应用名称：轻收 · TVInbox。
          当前附件沿用包名 io.github.zhshuaii.tvinbox.debug 和 CI 临时签名；本次名称调整不改变签名机制。
          跨构建覆盖安装可能遇到签名冲突；卸载原应用会清除该应用的收件箱。
          遥控器、手机浏览器和系统安装器兼容性仍需真机验收。

          Commit: ${GITHUB_SHA}
          EOF
          if gh release view "$TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping its source tag and assets unchanged." >> "$GITHUB_STEP_SUMMARY"
            echo 'This build is available in Actions Artifacts. Increment the version to publish another release.' >> "$GITHUB_STEP_SUMMARY"
          else
            gh release create "$TAG" dist/* --repo "$GH_REPO" --target "$GITHUB_SHA" --latest --title "轻收 · TVInbox ${VERSION}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          # Remove only the superseded release explicitly covered by this rename.
          # The new release must exist with its APK before removing the old one.
          if [[ "$VERSION" == '0.1' ]]; then
            gh release view "$TAG" --repo "$GH_REPO" --json assets --jq '.assets[].name' | grep -Fx "TVInbox-v${VERSION}.apk"
            if gh release view v0.1.0-preview.8 --repo "$GH_REPO" >/dev/null 2>&1; then
              gh release delete v0.1.0-preview.8 --repo "$GH_REPO" --yes --cleanup-tag
            fi
          fi
