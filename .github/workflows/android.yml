name: Android build and release

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Check web and signing code
        run: |
          node --test scripts/test-web.mjs
          python3 scripts/test_signing.py
      - name: Generate official Gradle wrapper
        run: gradle --no-daemon wrapper --gradle-version 8.11.1 --distribution-type bin
      - name: Check and compile APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug lintRelease assembleRelease
      - name: Validate app identity and collect unsigned build input
        id: metadata
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p unsigned
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned/app.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging unsigned/app.apk > "$RUNNER_TEMP/badging.txt"
          grep -F "package: name='io.github.zhshuaii.tvinbox'" "$RUNNER_TEMP/badging.txt"
          grep -F "versionName='$VERSION'" "$RUNNER_TEMP/badging.txt"
          grep -Fx "application-label:'轻收'" "$RUNNER_TEMP/badging.txt"
          ! grep -q 'application-debuggable' "$RUNNER_TEMP/badging.txt"
          (cd unsigned && sha256sum app.apk > SHA256SUMS)
          echo "Checks passed; unsigned build input is not a published APK." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-build-input
          path: unsigned/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gradle-wrapper
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: checks-and-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7

  sign-and-publish:
    needs: build
    if: github.repository == 'zhshuaii/TVInbox' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SIGNING_AVAILABLE: ${{ secrets.TVINBOX_SIGNING_BUNDLE != '' }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Report signing configuration
        shell: bash
        run: |
          if [[ "$SIGNING_AVAILABLE" != 'true' ]]; then
            echo '::warning::TVINBOX_SIGNING_BUNDLE is not configured. No APK will be signed or published.'
            echo '## Publication blocked' >> "$GITHUB_STEP_SUMMARY"
            echo 'Save the existing signing bundle as the repository secret TVINBOX_SIGNING_BUNDLE, then run this workflow on main. No new key was generated; existing Releases were not changed.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: env.SIGNING_AVAILABLE == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: env.SIGNING_AVAILABLE == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.SIGNING_AVAILABLE == 'true'
        with:
          name: unsigned-build-input
          path: unsigned
      - name: Install pinned signing tools
        if: env.SIGNING_AVAILABLE == 'true'
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0"'
      - name: Sign APK with the fixed private key
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          TVINBOX_SIGNING_BUNDLE: ${{ secrets.TVINBOX_SIGNING_BUNDLE }}
        shell: bash
        run: |
          (cd unsigned && sha256sum --check SHA256SUMS)
          python3 scripts/sign_apk.py unsigned/app.apk "dist/TVInbox-v${VERSION}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS)
          printf 'Commit: %s\nApp: 轻收\nVersion: %s\nPackage: io.github.zhshuaii.tvinbox\nCertificate SHA-256: %s\n' "$GITHUB_SHA" "$VERSION" "$(cat signing/release-cert.sha256)" > dist/build-info.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: env.SIGNING_AVAILABLE == 'true'
        with:
          name: TVInbox
          path: dist/
          retention-days: 14
          if-no-files-found: error
      - name: Publish signed APK to Releases
        if: env.SIGNING_AVAILABLE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh
