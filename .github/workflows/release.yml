name: Signed release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-read-only: true
      - name: Validate version and signing secrets
        env:
          TVINBOX_KEYSTORE_BASE64: ${{ secrets.TVINBOX_KEYSTORE_BASE64 }}
          TVINBOX_STORE_PASSWORD: ${{ secrets.TVINBOX_STORE_PASSWORD }}
          TVINBOX_KEY_ALIAS: ${{ secrets.TVINBOX_KEY_ALIAS }}
          TVINBOX_KEY_PASSWORD: ${{ secrets.TVINBOX_KEY_PASSWORD }}
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] || { echo 'Expected a vX.Y or vX.Y.Z tag'; exit 1; }
          grep -Fq "versionName = \"${GITHUB_REF_NAME#v}\"" app/build.gradle.kts || { echo 'Tag must match versionName'; exit 1; }
          for key in TVINBOX_KEYSTORE_BASE64 TVINBOX_STORE_PASSWORD TVINBOX_KEY_ALIAS TVINBOX_KEY_PASSWORD; do
            [[ -n "${!key}" ]] || { echo "Missing signing secret: $key"; exit 1; }
          done
          umask 077
          printf '%s' "$TVINBOX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tvinbox-release.jks"
      - name: Install pinned Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Check mobile web behavior
        run: node --test scripts/test-web.mjs
      - name: Build signed APK
        env:
          TVINBOX_KEYSTORE_PATH: ${{ runner.temp }}/tvinbox-release.jks
          TVINBOX_STORE_PASSWORD: ${{ secrets.TVINBOX_STORE_PASSWORD }}
          TVINBOX_KEY_ALIAS: ${{ secrets.TVINBOX_KEY_ALIAS }}
          TVINBOX_KEY_PASSWORD: ${{ secrets.TVINBOX_KEY_PASSWORD }}
        run: gradle --no-daemon --no-configuration-cache testReleaseUnitTest lintRelease assembleRelease
      - name: Verify and publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/TVInbox-${GITHUB_REF_NAME}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          (cd dist && sha256sum *.apk > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --latest --title "轻收 · TVInbox ${GITHUB_REF_NAME#v}"
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/tvinbox-release.jks"
