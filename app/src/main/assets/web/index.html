<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f7fc">
  <meta name="referrer" content="no-referrer">
  <title>轻收 · 上传到电视</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <main>
    <header class="brand"><span class="brand-mark" aria-hidden="true">↓</span><span>轻收</span></header>
    <section class="intro" aria-labelledby="title">
      <div class="tv-mark" aria-hidden="true">↓</div>
      <h1 id="title">上传到电视</h1>
      <p id="address" class="address"></p>
      <p class="muted">上传完成后，请在电视上选择安装。</p>
    </section>
    <section class="card" id="drop-zone" aria-label="选择安装包">
      <input id="file" type="file" accept=".apk,application/vnd.android.package-archive" hidden>
      <button id="choose" class="choose" type="button"><span class="upload-symbol" aria-hidden="true">↑</span><span id="choose-label">选择 APK</span><small>一次上传一个文件</small></button>
      <p class="limit">仅支持独立 APK · 收件箱上限 512 MiB</p>
    </section>
    <section id="transfer" class="card transfer" hidden aria-label="上传状态">
      <p id="filename" class="filename"></p>
      <div class="progress-heading"><span id="detail" class="muted"></span><span id="percent"></span></div>
      <progress id="progress" max="100" value="0" aria-label="上传进度"></progress>
      <p id="status" role="status" aria-live="polite"></p>
      <button id="cancel" type="button" class="secondary" hidden>取消上传</button>
    </section>
    <footer>文件仅发送到当前电视，不经过云端。<br>无需登录，仅在可信局域网内使用。</footer>
    <noscript>请启用浏览器 JavaScript 后上传。</noscript>
  </main>
</body>
</html>
